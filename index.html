<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estacionamento - Controle Total</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚗 Sistema de Gerenciamento de Estacionamento do Arthur </h1>
    <nav>
      <button onclick="showSection('vagas')">Vagas</button>
      <button onclick="showSection('clientes')">Clientes + Veículos</button>
      <button onclick="showSection('entrada')">Entrada / Saída</button>
      <button onclick="showSection('precos')">Cálculo de Preços</button>
      <button onclick="showSection('relatorios')">Relatórios</button>
    </nav>
  </header>

  <main>
    <!-- VAGAS -->
    <section id="vagas" class="section active">
      <h2>Vagas Disponíveis</h2>
      <div id="vagas-container"></div>
    </section>

    <!-- CLIENTES + VEÍCULOS -->
    <section id="clientes" class="section hidden">
      <h2>Cadastro de Clientes e Veículos</h2>
      
      <form id="form-cliente">
        <h3>Dados do Cliente</h3>
        <input type="text" id="cpf" placeholder="CPF" required>
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="tel" id="telefone" placeholder="Telefone" required>
        <input type="text" id="rg" placeholder="RG" required>
        <button type="submit">Cadastrar Cliente</button>
      </form>

      <form id="form-veiculo">
        <h3>Cadastrar Veículo</h3>
        <input type="text" id="cpf-veiculo" placeholder="CPF do Cliente" required>
        <input type="text" id="placa" placeholder="Placa" required>
        <input type="text" id="marca" placeholder="Marca" required>
        <input type="text" id="modelo" placeholder="Modelo" required>
        <input type="number" id="ano" placeholder="Ano" required>
        <input type="text" id="cor" placeholder="Cor" required>
        <select id="tamanho">
          <option value="moto">Moto</option>
          <option value="pequeno">Pequeno</option>
          <option value="medio" selected>Médio</option>
          <option value="grande">Grande</option>
        </select>
        <button type="submit">Cadastrar Veículo</button>
      </form>

      <div id="lista-clientes"></div>
      <div id="veiculos-cliente"></div>
    </section>

    <!-- ENTRADA / SAÍDA -->
    <section id="entrada" class="section hidden">
      <h2>Entrada e Saída</h2>
      <input type="text" id="placa-entrada" placeholder="Placa do Veículo" style="padding:10px; width:220px;">
      <button onclick="registrarEntrada()">Registrar Entrada</button>
      <button onclick="registrarSaida()">Registrar Saída</button>
      <h3>Veículos Estacionados:</h3>
      <div id="lista-estacionados"></div>
    </section>

    <!-- CÁLCULO DE PREÇOS -->
    <section id="precos" class="section hidden">
      <h2>Cálculo de Preço + Pagamento</h2>
      
      <div class="calculo-container">
        <div class="calculo-bloco">
          <h3>1. Calcular Valor</h3>
          <select id="tipo-tempo">
            <option value="horas">Horas</option>
            <option value="dias">Dias</option>
            <option value="meses">Meses</option>
          </select>
          <input type="number" id="quantidade-tempo" placeholder="Quantidade" step="0.1" value="1">
          <button onclick="calcularValor()">Calcular Valor</button>
        </div>

        <div id="calculo-resultado" style="margin: 15px 0; padding: 18px; background: #f0f9ff; border-radius: 8px;"></div>

        <div class="calculo-bloco">
          <h3>2. Registrar Pagamento</h3>
          <input type="text" id="placa-pagamento" placeholder="Placa do Veículo" style="width: 250px; padding: 10px;">
          <button onclick="registrarPagamento()">Registrar Pagamento</button>
        </div>
      </div>
    </section>

    <!-- RELATÓRIOS -->
    <section id="relatorios" class="section hidden">
      <h2>Relatórios</h2>
      <button onclick="mostrarRelatorios()">Gerar Relatório Completo</button>
      <div id="relatorio-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
